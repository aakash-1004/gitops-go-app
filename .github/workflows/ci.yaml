name: CI - Build, Push, Update Manifest

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: aakash0908/gitops-go-app:${{ steps.vars.outputs.sha_short }}

      - name: Update Helm values.yaml with new image tag
        run: |
          sed -i "s|tag: .*|tag: ${{ steps.vars.outputs.sha_short }}|" helm/gitops-go-app/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/gitops-go-app/values.yaml
          git commit -m "ci: bump image tag to ${{ steps.vars.outputs.sha_short }}" || echo "No changes to commit"
          git push
